# Aplicación web de Arrendia en el servidor (se usa igual para QA y producción).
# Variables que define el workflow: AMBIENTE, IMAGEN, APP_PORT.
name: arrendia-${AMBIENTE}

services:
  web:
    image: ${IMAGEN}
    container_name: arrendia-web-${AMBIENTE}
    env_file: .env
    ports:
      - "127.0.0.1:${APP_PORT}:8080"   # solo accesible por Cloudflare Tunnel, no desde la red
    networks: [arrendia-net]
    mem_limit: 350m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  arrendia-net:
    external: true
