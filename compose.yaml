name: arrendia

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: arrendia-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en el archivo .env}
    ports:
      - "${SQL_PORT:-14333}:1433"
    volumes:
      - arrendia-sqldata:/var/opt/mssql         
      - ./db-local:/var/opt/mssql/backup      
      - ./seed:/seed:ro                         
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: arrendia-web
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Arrendia: "Server=db,1433;Database=${DB_NAME:-Arrendia};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "${WEB_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  arrendia-sqldata:
    name: arrendia-sqldata
