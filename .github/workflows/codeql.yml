# Análisis de seguridad del código C# (inyección SQL, XSS, rutas, criptografía débil, etc.).
name: CodeQL

on:
  push:
    branches: [development, qa, main]
  pull_request:
    branches: [qa, main]
  schedule:
    - cron: "0 12 * * 1"   # lunes 6:00 a. m. hora de El Salvador
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analizar:
    name: Analizar C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Compilar
        run: dotnet build Arrendia.sln -c Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
