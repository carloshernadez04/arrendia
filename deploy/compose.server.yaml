# Aplicación web de Arrendia en el servidor (se usa igual para QA y producción).
# Variables que define el workflow: AMBIENTE, IMAGEN, APP_PORT.
name: arrendia-${AMBIENTE}

services:
  web:
    image: ${IMAGEN}
    container_name: arrendia-web-${AMBIENTE}
    env_file: .env
    environment:
      DataProtection__Ruta: /claves
      Archivos__RutaLocal: /archivos
    volumes:
      - claves:/claves                 # claves que firman las sesiones: sobreviven a cada despliegue
      - archivos:/archivos             # archivos subidos cuando no hay Cloudinary configurado
    ports:
      - "127.0.0.1:${APP_PORT}:8080"   # solo accesible por Cloudflare Tunnel, no desde la red
    networks: [arrendia-net]
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  claves:
  archivos:

networks:
  arrendia-net:
    external: true
