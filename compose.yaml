# Entorno local: SQL Server + aplicación web.
#   docker compose up -d          levanta todo
#   docker compose up -d db       solo la base (para correr la web desde Visual Studio)
#   docker compose down           detiene todo SIN borrar los datos
# Los datos de SQL Server viven en el volumen "arrendia-sqldata" y sobreviven a reinicios,
# a "docker compose down" y a reconstruir las imágenes. Solo se borran con "docker compose down -v".
name: arrendia

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: arrendia-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en el archivo .env}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - arrendia-sqldata:/var/opt/mssql          # datos persistentes
      - ./db-local:/var/opt/mssql/backup         # carpeta para restaurar respaldos (.bak)
      - ./seed:/seed:ro                          # script de datos iniciales
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: arrendia-web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Arrendia: "Server=db,1433;Database=${DB_NAME:-Arrendia};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "${WEB_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  arrendia-sqldata:
    name: arrendia-sqldata
