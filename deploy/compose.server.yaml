name: arrendia-${AMBIENTE}

services:
  web:
    image: ${IMAGEN}
    container_name: arrendia-web-${AMBIENTE}
    env_file: .env
    environment:
      DataProtection__Ruta: /claves
      Archivos__RutaLocal: /archivos
    volumes:
      - claves:/claves               
      - archivos:/archivos            
    ports:
      - "127.0.0.1:${APP_PORT}:8080"   
    networks: [arrendia-net]
    mem_limit: 512m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  claves:
  archivos:

networks:
  arrendia-net:
    external: true
